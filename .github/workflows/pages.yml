name: Deploy Tapescope Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser logic
        run: node --test
      - name: Build static site
        env:
          API_ORIGIN: ${{ vars.TAPESCOPE_API_ORIGIN }}
        run: python scripts/build_pages.py --api-origin "$API_ORIGIN"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
